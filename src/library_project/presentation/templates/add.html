<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ c.LINK_ADD_BOOK }}</title>
</head>
<body>
  <h1>{{ c.LINK_ADD_BOOK }}</h1>
  {% if error %}
  <p class="error">{{ error }}</p>
  {% endif %}
  <form action="{{ c.ROUTE_ADD }}" method="POST">
    <label for="title">Book Name</label>
    <input id="title" type="text" name="title" required>
    <label for="author">Book Author</label>
    <input id="author" type="text" name="author" required>
    <label for="rating">Rating</label>
    <input id="rating" type="number" step="any" name="rating" required>
    <button type="submit">{{ c.BUTTON_ADD_BOOK }}</button>
  </form>
</body>
</html>
